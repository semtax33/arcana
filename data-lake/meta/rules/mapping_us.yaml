notes_rules:
  - id: notes_rnd
    canonical_id: RND
    fs_type: IS
    tags:
      - ResearchAndDevelopmentExpense
      - ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost
      - InProcessResearchAndDevelopmentExpense
    label_patterns:
      - (?i)research\s+and\s+development
      - (?i)\bR&D\b
    report_name_patterns:
      - (?i)statement
      - (?i)operations
      - (?i)income
    amount_policy: abs
  - id: notes_amortization
    canonical_id: AMORTIZATION
    fs_type: CF
    tags:
      - AmortizationOfIntangibleAssets
      - FiniteLivedIntangibleAssetsAmortizationExpense
      - AmortizationOfAcquiredIntangibleAssets
    label_patterns:
      - (?i)amortization
    amount_policy: abs
  - id: notes_depreciation
    canonical_id: DEPRECIATION_EXPENSE
    fs_type: CF
    tags:
      - DepreciationDepletionAndAmortization
      - Depreciation
    label_patterns:
      - (?i)depreciation
    amount_policy: abs

