version: 1

settings:
  default_tolerance_abs: 10000
  large_unmapped_threshold: 10000000000

required_statements:
  - BS
  - IS
  - CF

core_ids:
  BS:
    - TOTAL_ASSETS
    - TOTAL_LIABILITIES
    - TOTAL_EQUITY
  IS:
    - NET_INCOME
  CF:
    - CFO
    - CFI
    - CFF

dangerous_duplicate_ids:
  - TOTAL_ASSETS
  - TOTAL_LIABILITIES
  - TOTAL_EQUITY
  - CFO
  - CFI
  - CFF
  - REVENUE
  - COGS
  - GROSS_PROFIT
  - SGNA
  - OPERATING_INCOME
  - PBT
  - TAX_EXPENSE
  - NET_INCOME
  - NET_INCOME_PARENT
  - EAOP
  - NEAOP

formula_checks:
  - name: "BS: 자산총계 = 부채총계 + 자본총계"
    statement_type: BS
    lhs:
      cid: TOTAL_ASSETS
      agg: first
    rhs:
      sum:
        - cid: TOTAL_LIABILITIES
          agg: first
        - cid: TOTAL_EQUITY
          agg: first

  - name: "BS: 유동자산 + 비유동자산 = 자산총계"
    statement_type: BS
    skip_if_missing: true
    lhs:
      sum:
        - cid: CURRENT_ASSETS
          agg: first
        - cid: NON_CURRENT_ASSETS
          agg: first
    rhs:
      cid: TOTAL_ASSETS
      agg: first

  - name: "BS: 유동부채 + 비유동부채 = 부채총계"
    statement_type: BS
    skip_if_missing: true
    lhs:
      sum:
        - cid: CURRENT_LIABILITIES
          agg: first
        - cid: NON_CURRENT_LIABILITIES
          agg: first
    rhs:
      cid: TOTAL_LIABILITIES
      agg: first

  - name: "BS: 지배주주지분 + 비지배지분 = 자본총계"
    statement_type: BS
    skip_if_missing: true
    lhs:
      sum:
        - cid: EAOP
          agg: first
        - cid: NEAOP
          agg: first
    rhs:
      cid: TOTAL_EQUITY
      agg: first

  - name: "IS: 매출총이익 - 판관비[/R&D] = 영업이익"
    statement_type: IS
    skip_if_missing: true
    actual:
      statement_type: IS
      cid: OPERATING_INCOME
      agg: first
    candidates:
      - mode: RND_INCLUDED_IN_SGNA
        formula: GROSS_PROFIT - SGNA
        expected:
          sub:
            - statement_type: IS
              cid: GROSS_PROFIT
              agg: first
            - statement_type: IS
              cid: SGNA
              agg: first

      - mode: RND_SEPARATE_FROM_SGNA
        formula: GROSS_PROFIT - SGNA - RND
        expected:
          sub:
            - statement_type: IS
              cid: GROSS_PROFIT
              agg: first
            - statement_type: IS
              cid: SGNA
              agg: first
            - statement_type: IS
              cid: RND
              agg: sum

  - name: "IS: PBT +/- TAX = NET_INCOME"
    statement_type: IS
    skip_if_missing: true
    actual:
      statement_type: IS
      cid: NET_INCOME
      agg: first
    candidates:
      - mode: TAX_AS_EXPENSE
        formula: PBT - TAX_EXPENSE
        expected:
          sub:
            - statement_type: IS
              cid: PBT
              agg: first
            - statement_type: IS
              cid: TAX_EXPENSE
              agg: first

      - mode: TAX_AS_BENEFIT
        formula: PBT + TAX_EXPENSE
        expected:
          sum:
            - statement_type: IS
              cid: PBT
              agg: first
            - statement_type: IS
              cid: TAX_EXPENSE
              agg: first

      - mode: WITH_DISCONTINUED_OPERATIONS_TAX_AS_EXPENSE
        formula: PBT - TAX_EXPENSE + DISCONTINUED_OPERATIONS_INCOME
        expected:
          sum:
            - sub:
                - statement_type: IS
                  cid: PBT
                  agg: first
                - statement_type: IS
                  cid: TAX_EXPENSE
                  agg: first
            - statement_type: IS
              cid: DISCONTINUED_OPERATIONS_INCOME
              agg: sum
              optional: true

      - mode: WITH_DISCONTINUED_OPERATIONS_TAX_AS_BENEFIT
        formula: PBT + TAX_EXPENSE + DISCONTINUED_OPERATIONS_INCOME
        expected:
          sum:
            - statement_type: IS
              cid: PBT
              agg: first
            - statement_type: IS
              cid: TAX_EXPENSE
              agg: first
            - statement_type: IS
              cid: DISCONTINUED_OPERATIONS_INCOME
              agg: sum
              optional: true

  - name: "IS: 지배주주순이익 + 비지배지분순이익 = 당기순이익"
    statement_type: IS
    skip_if_missing: true
    lhs:
      sum:
        - statement_type: IS
          cid: NET_INCOME_PARENT
          agg: first
        - statement_type: IS
          cid: NET_INCOME_NCI
          agg: first
          optional: true
    rhs:
      statement_type: IS
      cid: NET_INCOME
      agg: first

  - name: "CF: CFO + CFI + CFF = 현금증가 후보식"
    statement_type: CF
    source: normalized
    skip_if_missing: true
    candidates:
      - mode: CASH_CHANGE_AFTER_FX
        formula: CFO + CFI + CFF + FX_EFFECT_CASH + SPECIAL_CASH_CHANGE = CF_CASH_CHANGE
        expected:
          sum:
            - statement_type: CF
              cid: CFO
              agg: first
            - statement_type: CF
              cid: CFI
              agg: first
            - statement_type: CF
              cid: CFF
              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
        actual:
          statement_type: CF
          cid: CF_CASH_CHANGE
          agg: first

      - mode: CASH_CHANGE_BEFORE_FX
        formula: CFO + CFI + CFF = CF_CASH_CHANGE_BEFORE_FX
        expected:
          sum:
            - statement_type: CF
              cid: CFO
              agg: first
            - statement_type: CF
              cid: CFI
              agg: first
            - statement_type: CF
              cid: CFF
              agg: first
        actual:
          statement_type: CF
          cid: CF_CASH_CHANGE_BEFORE_FX
          agg: first

  - name: "CF: 기초현금 + 현금증가 후보식 = 기말현금"
    statement_type: CF
    source: normalized
    skip_if_missing: true
    actual:
      statement_type: CF
      cid: CF_CASH_END
      agg: first
    candidates:
      - mode: BEGIN_PLUS_CASH_CHANGE
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE
              agg: first
      - mode: BEGIN_PLUS_BEFORE_FX_PLUS_FX
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE_BEFORE_FX + FX_EFFECT_CASH = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE_BEFORE_FX
              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true

warning_rules:
  - id: section_header_mapped
    severity: ERROR
    description: "섹션 헤더가 canonical 계정으로 매핑됨"
    conditions:
      name_exact_any:
        - 자산
        - 부채
        - 자본
        - 주당손익
        - 당기순이익의귀속
        - 당기순손익의귀속
        - 총포괄이익의귀속
        - 총포괄손익의귀속
      canonical_id_not: UNMAPPED

  - id: comprehensive_income_as_net_income_parent
    severity: ERROR
    description: "총포괄손익 귀속이 NET_INCOME_PARENT로 매핑됨"
    conditions:
      canonical_id: NET_INCOME_PARENT
      context_contains_any:
        - 총포괄

  - id: cash_generated_from_operations_as_cfo
    severity: ERROR
    description: "영업활동에서 창출된 현금흐름이 CFO로 매핑됨"
    conditions:
      canonical_id: CFO
      name_contains_any:
        - 영업활동에서창출된현금
        - 영업에서창출된현금
        - 영업으로부터창출된현금

  - id: cf_begin_end_cash_as_bs_cash
    severity: ERROR
    description: "CF의 기초/기말 현금이 CASH_AND_EQUIVALENTS로 매핑됨"
    conditions:
      statement_type: CF
      canonical_id: CASH_AND_EQUIVALENTS
      name_contains_any:
        - 기초의현금및현금성자산
        - 기말의현금및현금성자산

  - id: net_borrowing_as_issue_or_repay
    severity: WARN
    description: "순차입/순상환이 DEBT_ISSUE 또는 DEBT_REPAY로 직접 매핑됨"
    conditions:
      canonical_id_in:
        - DEBT_ISSUE
        - DEBT_REPAY
      name_contains_any:
        - 순차입
        - 순상환

factor_snapshot:
  enabled: true
