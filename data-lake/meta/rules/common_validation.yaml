              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
            - statement_type: CF
              cid: CF_TRANSLATION_DIFFERENCE
              agg: sum
              optional: true
      - mode: BEGIN_PLUS_CASH_CHANGE_PLUS_SPECIAL
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE + SPECIAL_CASH_CHANGE = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE
              agg: first
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
      - mode: BEGIN_PLUS_CASH_CHANGE_PLUS_FX_PLUS_SPECIAL
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE + FX_EFFECT_CASH + SPECIAL_CASH_CHANGE = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE
              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
      - mode: BEGIN_PLUS_CASH_CHANGE_PLUS_FX_PLUS_SPECIAL_TRANSLATION
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE + FX_EFFECT_CASH + SPECIAL_CASH_CHANGE + CF_TRANSLATION_DIFFERENCE = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE
              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
            - statement_type: CF
              cid: CF_TRANSLATION_DIFFERENCE
              agg: sum
              optional: true
      - mode: BEGIN_PLUS_CASH_CHANGE_PLUS_DEBUG_FALLBACKS
        formula: CF_CASH_BEGIN + CF_CASH_CHANGE + FX_EFFECT_CASH + unmapped FX + SPECIAL_CASH_CHANGE + unmapped special + CF_TRANSLATION_DIFFERENCE + unmapped translation = CF_CASH_END
        expected:
          sum:
            - statement_type: CF
              cid: CF_CASH_BEGIN
              agg: first
            - statement_type: CF
              cid: CF_CASH_CHANGE
              agg: first
            - statement_type: CF
              cid: FX_EFFECT_CASH
              agg: sum
              optional: true
            - statement_type: CF
              canonical_id: UNMAPPED
              name_contains_all:
                - 현금
                - 환율
              source: debug
              agg: sum
              optional: true
            - statement_type: CF
              canonical_id: UNMAPPED
              name_contains_all:
                - 현금
                - 외화환산
              source: debug
              agg: sum
              optional: true
            - statement_type: CF
              cid: SPECIAL_CASH_CHANGE
              agg: sum
              optional: true
            - statement_type: CF
              canonical_id: UNMAPPED
              name_contains_any:
