                - 처분자산집단
                - 연결범위
                - 소유주분배예정
                - 합병
                - 사업결합
                - 분할
                - 중단영업
                - 연결자본거래
              source: debug
              agg: sum_unique
              optional: true
            - statement_type: CF
              cid: CF_TRANSLATION_DIFFERENCE
              agg: sum
              optional: true
