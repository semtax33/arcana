              canonical_id: UNMAPPED
              name_contains_any:
                - 외화환산차이
                - 환율변동차이
                - 재무제표환산
              source: debug
              agg: sum
              optional: true
    tolerance_abs: 100000

warning_rules:
  - id: section_header_mapped
    severity: ERROR
    description: "섹션 헤더가 canonical 계정으로 매핑됨"
    conditions:
      name_exact_any:
        - 자산
        - 부채
        - 자본
        - 주당손익
        - 당기순이익의귀속
        - 당기순손익의귀속
        - 총포괄이익의귀속
        - 총포괄손익의귀속
      canonical_id_not: UNMAPPED

  - id: comprehensive_income_as_net_income_parent
    severity: ERROR
    description: "총포괄손익 귀속이 NET_INCOME_PARENT로 매핑됨"
    conditions:
      canonical_id: NET_INCOME_PARENT
      context_contains_any:
        - 총포괄

  - id: cash_generated_from_operations_as_cfo
    severity: ERROR
    description: "영업활동에서 창출된 현금흐름이 CFO로 매핑됨"
    conditions:
      canonical_id: CFO
      name_contains_any:
        - 영업활동에서창출된현금
        - 영업에서창출된현금
        - 영업으로부터창출된현금

  - id: cf_begin_end_cash_as_bs_cash
    severity: ERROR
    description: "CF의 기초/기말 현금이 CASH_AND_EQUIVALENTS로 매핑됨"
    conditions:
      statement_type: CF
      canonical_id: CASH_AND_EQUIVALENTS
      name_contains_any:
        - 기초의현금및현금성자산
        - 기말의현금및현금성자산

  - id: net_borrowing_as_issue_or_repay
    severity: WARN
    description: "순차입/순상환이 DEBT_ISSUE 또는 DEBT_REPAY로 직접 매핑됨"
    conditions:
      canonical_id_in:
        - DEBT_ISSUE
        - DEBT_REPAY
      name_contains_any:
        - 순차입
        - 순상환

factor_snapshot:
  enabled: true
