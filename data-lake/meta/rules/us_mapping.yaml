    label_patterns:
      - (?i)\binterest\s+paid\b
    report_name_patterns:
      - (?i)cash\s+flows?
      - (?i)supplemental
    amount_policy: abs
    cash_direction: outflow
  - id: notes_tax_paid
    canonical_id: TAX_PAID
    fs_type: CF
    tags:
      - IncomeTaxesPaidNet
      - IncomeTaxesPaid
    label_patterns:
      - (?i)\bincome\s+tax(es)?\s+paid\b
    report_name_patterns:
      - (?i)cash\s+flows?
      - (?i)supplemental
    amount_policy: abs
    cash_direction: outflow
  - id: notes_dividends_paid
    canonical_id: DIV_PAID
    fs_type: CF
    tags:
      - PaymentsOfDividends
      - PaymentsOfDividendsCommonStock
      - PaymentsOfOrdinaryDividends
    tag_patterns:
      - (?i)paymentsof.*dividends
    label_patterns:
      - (?i)\bdividends?\s+paid\b
      - (?i)\bpayments?\s+of\s+dividends?\b
    label_exclude_patterns:
      - (?i)\bdeclared\b
      - (?i)\bpayable\b
      - (?i)\bper\s+share\b
    report_name_patterns:
      - (?i)cash\s+flows?
      - (?i)financing
    amount_policy: abs
    cash_direction: outflow
  - id: notes_buyback
    canonical_id: BUYBACK
    fs_type: CF
    tags:
      - PaymentsForRepurchaseOfCommonStock
      - PaymentsForRepurchaseOfEquity
    tag_patterns:
      - (?i)paymentsforrepurchaseof.*(stock|equity)
    label_patterns:
      - (?i)\bpayments?\s+for\s+repurchase\s+of\s+(common\s+)?stock\b
      - (?i)\brepurchase\s+of\s+(common\s+)?stock\b
    label_exclude_patterns:
      - (?i)\bauthorized\b
      - (?i)\bnumber\s+of\s+shares\b
      - (?i)\bshares\s+repurchased\b
    report_name_patterns:
      - (?i)cash\s+flows?
      - (?i)financing
    amount_policy: abs
    cash_direction: outflow

