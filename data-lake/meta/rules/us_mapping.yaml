notes_rules:
  - id: notes_rnd
    canonical_id: RND
    fs_type: IS
    tags:
      - ResearchAndDevelopmentExpense
      - ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost
      - InProcessResearchAndDevelopmentExpense
      - ResearchAndDevelopmentExpenseSoftwareExcludingAcquiredInProcessCost
      - OtherResearchAndDevelopmentExpense
    tag_patterns:
      - (?i)(researchanddevelopment|researchdevelopment).*(expense|cost)
      - (?i)(product|technology|software)development(expense|cost)
    label_patterns:
      - (?i)research\s+and\s+development
      - (?i)\bR&D\b
      - (?i)\b(product|technology|software)\s+development\s+(expense|costs?)\b
    label_exclude_patterns:
      - (?i)\bpolicy\b
      - (?i)\bmember\b
      - (?i)\btable\b
      - (?i)\bschedule\b
      - (?i)\brollforward\b
      - (?i)\breserve\b
      - (?i)\boil\s+and\s+gas\s+reserves\b
      - (?i)\bfuture\s+net\s+cash\s+flows\b
    report_name_patterns:
      - (?i)statement
      - (?i)operations
      - (?i)income
    amount_policy: abs
  - id: notes_revenue
    canonical_id: REVENUE
    fs_type: IS
    tags:
