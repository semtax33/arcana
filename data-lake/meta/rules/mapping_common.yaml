rules:
  # =========================
  # 0. 강제 제외 / 섹션 헤더
  # =========================

  - id: bs_section_headers
    fs_type: BS
    priority: 1000
    exact_any:
      - 자산
      - 부채
      - 자본
    canonical_id: UNMAPPED
    reason: 재무상태표 섹션 헤더

  - id: is_section_headers
    fs_type: IS
    priority: 1000
    exact_any:
      - 당기순이익의귀속
      - 당기순손익의귀속
      - 총포괄이익의귀속
      - 총포괄손익의귀속
      - 주당손익
      - 지배기업의소유주지분에대한주당이익
    canonical_id: UNMAPPED
    reason: 손익계산서 섹션 헤더

  - id: cf_cfo_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 영업활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 영업활동현금흐름 섹션 제목이므로 최종 CFO가 아님

  - id: cf_cfi_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 투자활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 투자활동현금흐름 섹션 제목이므로 최종 CFI가 아님

  - id: cf_cff_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 재무활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 재무활동현금흐름 섹션 제목이므로 최종 CFF가 아님

  # =========================
  # 1. 현금흐름표 CF
  # =========================

  - id: cf_cash_generated_from_operations
    fs_type: CF
    priority: 950
    include_any:
      - 영업활동에서창출된현금흐름
      - 영업에서창출된현금
      - 영업으로부터창출된현금
      - 영업활동으로부터 창출된 현금흐름
    canonical_id: UNMAPPED
    reason: CFO 이전 subtotal

  - id: cf_cfo_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 영업활동현금흐름
      - 영업활동순현금흐름
      - 영업활동으로인한순현금흐름
      - 영업활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    exclude_any:
      - 창출
      - 조정전
    canonical_id: CFO
    amount_policy: as_reported
    reason: 금액 있는 영업활동현금흐름 subtotal

  - id: cf_cfi_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 투자활동현금흐름
      - 투자활동순현금흐름
      - 투자활동으로인한순현금흐름
      - 투자활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    canonical_id: CFI
    amount_policy: as_reported
    reason: 금액 있는 투자활동현금흐름 subtotal

  - id: cf_cff_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 재무활동현금흐름
      - 재무활동순현금흐름
      - 재무활동으로인한순현금흐름
      - 재무활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    canonical_id: CFF
    amount_policy: as_reported
    reason: 금액 있는 재무활동현금흐름 subtotal

