rules:
  # =========================
  # 0. 강제 제외 / 섹션 헤더
  # =========================

  - id: bs_section_headers
    fs_type: BS
    priority: 1000
    exact_any:
      - 자산
      - 부채
      - 자본
    canonical_id: UNMAPPED
    reason: 재무상태표 섹션 헤더

  - id: is_section_headers
    fs_type: IS
    priority: 1000
    exact_any:
      - 당기순이익의귀속
      - 당기순손익의귀속
      - 총포괄이익의귀속
      - 총포괄손익의귀속
      - 주당손익
      - 지배기업의소유주지분에대한주당이익
    canonical_id: UNMAPPED
    reason: 손익계산서 섹션 헤더

  - id: cf_cfo_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 영업활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 영업활동현금흐름 섹션 제목이므로 최종 CFO가 아님

  - id: cf_cfi_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 투자활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 투자활동현금흐름 섹션 제목이므로 최종 CFI가 아님

  - id: cf_cff_section_header_unmapped
    fs_type: CF
    priority: 1000
    exact_any:
      - 재무활동현금흐름
    conditions:
      has_children: true
      amount_is_zero_or_blank: true
    canonical_id: UNMAPPED
    reason: 재무활동현금흐름 섹션 제목이므로 최종 CFF가 아님

  # =========================
  # 1. 현금흐름표 CF
  # =========================

  - id: cf_cash_generated_from_operations
    fs_type: CF
    priority: 950
    include_any:
      - 영업활동에서창출된현금흐름
      - 영업에서창출된현금
      - 영업으로부터창출된현금
      - 영업활동으로부터 창출된 현금흐름
    canonical_id: UNMAPPED
    reason: CFO 이전 subtotal

  - id: cf_cfo_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 영업활동현금흐름
      - 영업활동순현금흐름
      - 영업활동으로인한순현금흐름
      - 영업활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    exclude_any:
      - 창출
      - 조정전
    canonical_id: CFO
    amount_policy: as_reported
    reason: 금액 있는 영업활동현금흐름 subtotal

  - id: cf_cfi_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 투자활동현금흐름
      - 투자활동순현금흐름
      - 투자활동으로인한순현금흐름
      - 투자활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    canonical_id: CFI
    amount_policy: as_reported
    reason: 금액 있는 투자활동현금흐름 subtotal

  - id: cf_cff_plain_subtotal
    fs_type: CF
    priority: 900
    exact_any:
      - 재무활동현금흐름
      - 재무활동순현금흐름
      - 재무활동으로인한순현금흐름
      - 재무활동으로인한현금흐름
    conditions:
      amount_is_zero_or_blank: false
    canonical_id: CFF
    amount_policy: as_reported
    reason: 금액 있는 재무활동현금흐름 subtotal

  - id: cf_cash_begin
    fs_type: CF
    priority: 850
    exact_any:
      - 기초의현금및현금성자산
      - 기초현금및현금성자산
    canonical_id: CF_CASH_BEGIN
    amount_policy: as_reported
    reason: 현금흐름표 기초 현금

  - id: cf_cash_end
    fs_type: CF
    priority: 850
    exact_any:
      - 기말의현금및현금성자산
      - 당기말의현금및현금성자산
      - 기말현금및현금성자산
    canonical_id: CF_CASH_END
    amount_policy: as_reported
    reason: 현금흐름표 기말 현금

  - id: cf_fx_effect_cash
    fs_type: CF
    priority: 850
    exact_any:
      - 외화표시현금및현금성자산의환율변동효과
      - 현금및현금성자산에대한환율변동효과
    canonical_id: FX_EFFECT_CASH
    amount_policy: as_reported
    reason: 현금및현금성자산 환율변동효과

  - id: cf_debt_net_borrowing
    fs_type: CF
    priority: 850
    exact_any:
      - 단기차입금의순차입
      - 차입금의순차입
    canonical_id: DEBT_NET_BORROWING
    fallback_if_missing: UNMAPPED
    reason: 차입금 차입/상환 순액

  - id: cf_lease_repayment
    fs_type: CF
    priority: 850
    exact_any:
      - 리스부채의상환
      - 리스부채상환
      - 리스부채의감소
      - 리스부채감소
    canonical_id: LEASE_REPAYMENT
    amount_policy: abs
    cash_direction: outflow
    reason: 리스부채 상환/감소

  - id: cf_cash_change_before_fx
    fs_type: CF
    priority: 850
    exact_any:
      - 환율변동효과전현금및현금성자산의증가감소
      - 환율효과전현금및현금성자산의증가감소
      - 환율변동효과반영전현금및현금성자산의순증가감소
    canonical_id: CF_CASH_CHANGE_BEFORE_FX
    amount_policy: as_reported
    reason: CFO+CFI+CFF와 일치하는 환율효과 전 현금증가

  - id: cf_fx_effect_cash
    fs_type: CF
    priority: 850
    exact_any:
      - 외화표시현금및현금성자산의환율변동효과
      - 현금및현금성자산에대한환율변동효과
    canonical_id: FX_EFFECT_CASH
    amount_policy: as_reported
    reason: 기초현금과 기말현금 검산에 필요한 환율변동효과

  - id: cf_cash_begin
    fs_type: CF
    priority: 850
    exact_any:
      - 기초의현금및현금성자산
      - 기초현금및현금성자산
    canonical_id: CF_CASH_BEGIN
    amount_policy: as_reported
    reason: 현금흐름표 기초 현금

  - id: cf_cash_end
    fs_type: CF
    priority: 850
    exact_any:
      - 기말의현금및현금성자산
      - 기말현금및현금성자산
    canonical_id: CF_CASH_END
    amount_policy: as_reported
    reason: 현금흐름표 기말 현금

  - id: cf_capex_ppe
    fs_type: CF
    priority: 800
    exact_any:
      - 유형자산의취득
      - 유형자산취득
    canonical_id: CAPEX_PPE
    amount_policy: abs
    cash_direction: outflow
    reason: 유형자산 취득 지출

  - id: cf_capex_intang
    fs_type: CF
    priority: 800
    exact_any:
      - 무형자산의취득
      - 무형자산취득
    canonical_id: CAPEX_INTANG
    amount_policy: abs
    cash_direction: outflow
    reason: 무형자산 취득 지출

  - id: cf_depreciation_expense
    fs_type: CF
    priority: 800
    exact_any:
      - 감가상각비
    canonical_id: DEPRECIATION_EXPENSE
    reason: 감가상각비

  - id: cf_amortization
    fs_type: CF
    priority: 800
    exact_any:
      - 무형자산상각비
    canonical_id: AMORTIZATION
    reason: 무형자산 상각비

  - id: cf_ppe_disposal
    fs_type: CF
    priority: 800
    exact_any:
      - 유형자산의처분
      - 유형자산처분
    canonical_id: PPE_DISPOSAL_PROCEEDS
    amount_policy: abs
    cash_direction: inflow
    reason: 유형자산 처분대금

  - id: cf_intangible_disposal
    fs_type: CF
    priority: 800
    exact_any:
      - 무형자산의처분
      - 무형자산처분
    canonical_id: INTANGIBLE_DISPOSAL_PROCEEDS
    amount_policy: abs
    cash_direction: inflow
    reason: 무형자산 처분대금

  - id: cf_interest_paid
    fs_type: CF
    priority: 800
    exact_any:
      - 이자의지급
      - 이자지급
    canonical_id: INT_PAID
    amount_policy: abs
    cash_direction: outflow
    reason: 이자 지급

  - id: cf_tax_paid
    fs_type: CF
    priority: 800
    exact_any:
      - 법인세의납부
      - 법인세납부
      - 법인세지급
    canonical_id: TAX_PAID
    amount_policy: abs
    cash_direction: outflow
    reason: 법인세 지급

  - id: cf_dividend_paid
    fs_type: CF
    priority: 800
    exact_any:
      - 배당금의지급
      - 배당의지급
      - 배당
    canonical_id: DIV_PAID
    amount_policy: abs
    cash_direction: outflow
    reason: 배당금 지급

  - id: cf_tax_paid_or_refund
    fs_type: CF
    priority: 800
    exact_any:
      - 법인세의환급납부
      - 법인세환급납부
      - 법인세의납부
      - 법인세납부
      - 법인세지급
    canonical_id: TAX_PAID
    reason: 법인세 현금흐름. 환급/납부 순액은 현재 TAX_PAID로 fallback

  - id: cf_debt_issue
    fs_type: CF
    priority: 700
    include_any:
      - 차입금의차입
      - 차입금의증가
      - 사채의발행
      - 금융부채의증가
      - 단기금융부채의증가
      - 장기금융부채의증가
      - 단기차입금의순차입
    canonical_id: DEBT_ISSUE
    amount_policy: abs
    cash_direction: inflow
    reason: 차입금/사채 유입

  - id: cf_debt_repay
    fs_type: CF
    priority: 700
    include_any:
      - 차입금의상환
      - 차입금의감소
      - 사채의상환
      - 금융부채의감소
      - 단기금융부채의감소
      - 장기금융부채의감소
      - 유동성장기부채의상환
    canonical_id: DEBT_REPAY
    amount_policy: abs
    cash_direction: outflow
    reason: 차입금/사채 상환

  - id: bs_non_current_liabilities
    fs_type: BS
    priority: 700
    exact_any:
      - 비유동부채
    canonical_id: NON_CURRENT_LIABILITIES
    fallback_if_missing: UNMAPPED

  - id: cf_buyback
    fs_type: CF
    priority: 700
    exact_any:
      - 자기주식의취득
      - 자기주식취득
    canonical_id: BUYBACK
    amount_policy: abs
    cash_direction: outflow
    reason: 자기주식 취득

  - id: cf_equity_issue
    fs_type: CF
    priority: 700
    include_any:
      - 유상증자
      - 주식발행
      - 비지배지분의유상증자참여
      - 연결자본거래로인한현금유입
    canonical_id: EQ_ISSUE
    amount_policy: abs
    cash_direction: inflow
    reason: 자본 유입

  # =========================
  # 2. 재무상태표 BS
  # =========================

  - id: bs_long_term_debt_generic_borrowings
    fs_type: BS
    priority: 850
    exact_any:
      - 차입금
    context_include_any:
      - 비유동부채
    canonical_id: LONG_TERM_DEBT
    reason: 비유동부채 하위 차입금

  - id: bs_short_term_debt_generic_borrowings
    fs_type: BS
    priority: 850
    exact_any:
      - 차입금
    context_include_any:
      - 유동부채
    canonical_id: SHORT_TERM_DEBT
    reason: 유동부채 하위 차입금

  - id: bs_liabilities_and_equity_total
    fs_type: BS
    priority: 850
    exact_any:
      - 부채및자본총계
      - 부채와자본총계
      - 부채와자본합계
    canonical_id: UNMAPPED
    reason: 자산총계와 중복되는 보조 총계

  - id: bs_total_assets
    fs_type: BS
    priority: 800
    exact_any:
      - 자산총계
      - 자산합계
    canonical_id: TOTAL_ASSETS

  - id: bs_total_liabilities
    fs_type: BS
    priority: 800
    exact_any:
      - 부채총계
      - 부채합계
    canonical_id: TOTAL_LIABILITIES

  - id: bs_total_equity
    fs_type: BS
    priority: 800
    exact_any:
      - 자본총계
      - 자본합계
    canonical_id: TOTAL_EQUITY

  - id: bs_current_assets
    fs_type: BS
    priority: 700
    exact_any:
      - 유동자산
      - 유동자산 합계
      - 유동자산합계
      - 유동자산 계
      - 유동자산(금융업)
    canonical_id: CURRENT_ASSETS

  - id: bs_non_current_assets
    fs_type: BS
    priority: 700
    exact_any:
      - 비유동자산
      - 비유동 자산
      - 비유동자산 합계
      - 비유동자산합계
      - 비유동자산 계
      - 비유동자산(금융업)
    canonical_id: NON_CURRENT_ASSETS

  - id: bs_current_liabilities
    fs_type: BS
    priority: 700
    exact_any:
      - 유동부채
    canonical_id: CURRENT_LIABILITIES

  - id: bs_cash
    fs_type: BS
    priority: 700
    exact_any:
      - 현금및현금성자산
      - 현금및현금성자산, 금융업
      - 현금및현금성자산, 비금융업
      - 현금및현금성자산-증권업
    canonical_id: CASH_AND_EQUIVALENTS

  - id: bs_short_term_financial_assets
    fs_type: BS
    priority: 700
    exact_any:
      - 단기금융자산
      - 단기금융상품
      - 단기투자자산
    canonical_id: SHORT_TERM_FINANCIAL_ASSETS

  - id: bs_inventory
    fs_type: BS
    priority: 700
    exact_any:
      - 재고자산
    canonical_id: INVENTORIES

  - id: bs_ppe
    fs_type: BS
    priority: 700
    exact_any:
      - 유형자산
    canonical_id: PPE

  - id: bs_intangible_assets
    fs_type: BS
    priority: 700
    exact_any:
      - 무형자산
    canonical_id: INTANGIBLE_ASSETS

  - id: bs_contract_assets
    fs_type: BS
    priority: 700
    exact_any:
      - 계약자산
    canonical_id: CONTRACT_ASSETS

  - id: bs_contract_liabilities
    fs_type: BS
    priority: 700
    exact_any:
      - 계약부채
      - 장기계약부채
    canonical_id: CONTRACT_LIABILITIES

  - id: bs_advances_from_customers
    fs_type: BS
    priority: 700
    exact_any:
      - 선수금
    canonical_id: ADVANCES_FROM_CUSTOMERS

  - id: bs_trade_receivables
    fs_type: BS
    priority: 700
    exact_any:
      - 매출채권
    canonical_id: TRADE_RECEIVABLES

  - id: bs_trade_and_other_receivables_fallback
    fs_type: BS
    priority: 680
    exact_any:
      - 매출채권및기타채권
      - 장기매출채권및기타채권
      - 매출채권 및 기타채권
      - 매출채권과기타채권
      - 매출채권및기타수취채권
      - 매출채권과기타수취채권
      - 매출채권및기타금융채권
      - 매출채권 및 기타채권 합계
      - 매출채권 및 기타유동채권
    canonical_id: OTHER_RECEIVABLES
    reason: 현재 캐노니컬에 매출채권및기타채권 계정이 없어 fallback

  - id: bs_trade_payables
    fs_type: BS
    priority: 700
    exact_any:
      - 매입채무
    canonical_id: TRADE_PAYABLES

  - id: bs_trade_and_other_payables_fallback
    fs_type: BS
    priority: 680
    exact_any:
      - 매입채무및기타채무
      - 매입채무 및 기타채무
      - 장기매입채무및기타채무
      - 장기매입채무 및 기타채무
      - 매입채무및미지급금
      - 매입채무 및 미지급금
    canonical_id: OTHER_PAYABLES
    reason: 현재 캐노니컬에 매입채무및기타채무 계정이 없어 fallback

  - id: bs_short_term_debt
    fs_type: BS
    priority: 700
    exact_any:
      - 단기차입금
      - 유동성장기부채
      - 단기금융부채
    canonical_id: SHORT_TERM_DEBT

  - id: bs_long_term_debt
    fs_type: BS
    priority: 700
    exact_any:
      - 장기차입금
      - 사채
      - 장기금융부채
    canonical_id: LONG_TERM_DEBT

  - id: bs_lease_liability
    fs_type: BS
    priority: 700
    exact_any:
      - 리스부채
      - 유동리스부채
      - 비유동리스부채
    canonical_id: LEASE_LIABILITY

  - id: bs_parent_equity
    fs_type: BS
    priority: 700
    exact_any:
      - 지배기업의소유주에게귀속되는자본
