template_rules:
  standard:
    required_section_keys:
      - overview
      - products_services
      - raw_materials_facilities
      - sales_orders
    title_patterns:
      - '주요\s*제품'
      - '원재료'
      - '매출\s*및\s*수주'
  financial:
    required_section_keys:
      - overview
      - business_status
    title_patterns:
      - '영업의\s*현황'
      - '파생상품거래\s*현황'
      - '영업설비'
      - '재무건전성'
  mixed:
    title_patterns:
      - '\(\s*제조서비스업\s*\)'
      - '\(\s*금융업\s*\)'
  real_estate_light:
    text_patterns:
      - '부동산투자회사'
      - '리츠'
      - 'REIT'
      - '부동산의\s*취득'
    not_applicable_min_count: 2
  legacy:
    title_patterns:
      - '^II\.\s*사업의\s*내용'

heading_patterns:
  - '^\s*\d+\.\s*[^\n]{1,80}$'
  - '^\s*[가-힣]\.\s*[^\n]{1,100}$'
  - '^\s*\(\s*\d+\s*\)\s*[^\n]{1,100}$'
  - '^\s*\[[^\]]{1,80}\]\s*$'
  - '^\s*<[^>]{1,80}>\s*$'
  - '^◎\s*[^\n]{1,100}$'
  - '^□\s*[^\n]{1,100}$'
  - '^○\s*[^\n]{1,100}$'
  - '사업의\s*개요'
  - '영업의\s*현황'
  - '주요\s*제품'
  - '원재료'
  - '생산\s*및\s*설비'
  - '매출\s*및\s*수주'
  - '수주상황'
  - '판매전략'
  - '위험관리'
  - '시장위험'
  - '연구개발'
  - '투자의사결정'
  - '기타\s*참고사항'

not_applicable_patterns:
  - '해당사항\s*없'
  - '해당\s*사항\s*없'
  - '해당사항이\s*없'
  - '해당\s*없음'

layout_table_rules:
  layout_classes:
    - "nb"
  unit_patterns:
    - '^\s*\(\s*단위\s*:'
    - '^\s*\(\s*Unit\s*:'
    - '^\s*\(\s*백만원'
    - '^\s*\(\s*억원'
  note_patterns:
    - '^\s*※'
    - '^\s*주\)'
    - '^\s*\*'
  max_layout_rows: 2
  max_layout_cols: 2

table_kind_rules:
  unit_kind: "footnote"
  max_title_rows: 1
  max_title_cols: 3
  max_title_text_length: 80
  title_patterns:
    - '^\s*\[.+\]'
    - '^\s*\[.+\]\s*$'
    - '^\s*\(.+\)\s*$'
    - '^\s*-?\s*\d{4}'
  max_paragraph_rows: 2
  paragraph_min_text_length: 120
  paragraph_patterns:
    - '<BR\s*/?>'
  data_min_rows: 2
  data_min_cols: 2

metadata_patterns:
  rcept_no_patterns:
    - 'rcept_no["''\s:=]+([0-9]{14})'
    - 'rcpNo["''\s:=]+([0-9]{14})'
  corp_code_patterns:
    - 'corp_code["''\s:=]+([0-9]{8})'
    - 'corpCode["''\s:=]+([0-9]{8})'
  corp_name_patterns:
    - 'corp_name["''\s:=]+([^"''<>]{1,80})'
    - 'corpName["''\s:=]+([^"''<>]{1,80})'

header_detection_rules:
  max_header_rows: 3
  th_ratio_threshold: 0.5
  header_keyword_patterns:
    - '구\s*분'
    - '부\s*문'
    - '품\s*목'
    - '매\s*출'
    - '금\s*액'
    - '비\s*중'
    - '제\s*\d+\s*기'

data_type_patterns:
  percent:
    - '^-?\(?[0-9,]+(?:\.[0-9]+)?\)?\s*%$'
  date:
    - '^\d{4}[.\-/]\d{1,2}(?:[.\-/]\d{1,2})?$'
  number:
    - '^-?\(?[0-9,]+(?:\.[0-9]+)?\)?$'

source_uri_rules:
  relative_to: "project_root"

business_domain_patterns:
  manufacturing_service:
    - '\(\s*제조서비스업\s*\)'
  financial:
    - '\(\s*금융업\s*\)'
  insurance:
    - '\(\s*보험업\s*\)'

